name: "Test"

on:
  pull_request:

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v3
        with:
          python-version: "3.11"
      - run: pip install pytest
      
      # Removed redefine-related steps as redefinedev/redefine-action@1 is not available
      - run: pytest .

